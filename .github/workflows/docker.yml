name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/docker.yml"
      - ".github/smoke-test.sh"
  # Weekly rebuild to pick up base-image (rocker/r2u) security updates
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Exercise the whole lane without publishing: every leg builds, pushes its layers by digest and is smoke-tested, then the publish job prints the manifest list and the tag list it would apply instead of attaching any tag."
        type: boolean
        default: false

env:
  IMAGE: jmgirard/rstudio2u

jobs:
  # One leg per (variant, architecture), each on a runner of that architecture:
  # nothing is emulated, so the arm64 image is built and booted by an arm64 CPU.
  # Each leg pushes its layers WITHOUT a tag (push-by-digest), pulls that exact
  # digest back, and smoke-tests it — so the bytes that are tested are the bytes
  # that ship (GP7). An untagged push is invisible to users: no moving tag moves
  # until the publish job assembles the manifest list, which it only reaches
  # when every leg of that variant passed.
  build:
    # The notify job's variant extraction parses this name ("build (<variant>,
    # <arch>)") to recover the failed variant names; keep the two in step.
    name: build (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # A resolute failure must never block noble (GP3 preview tier), and an
      # amd64 failure must not cancel the arm64 leg mid-build.
      fail-fast: false
      matrix:
        include:
          - variant: noble
            ubuntu_version: "24.04"
            arch: amd64
            runner: ubuntu-latest
          - variant: noble
            ubuntu_version: "24.04"
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: resolute
            ubuntu_version: "26.04"
            arch: amd64
            runner: ubuntu-latest
          - variant: resolute
            ubuntu_version: "26.04"
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jmgirard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Resolve + validate the current stable RStudio version. The resolver
      # exits non-zero on an empty/HTML/format-changed scrape, so pipefail + -e
      # abort the job here rather than building a mis-versioned image (Known
      # issue #2 / GP2). --tag gives the '-' form used both for the immutable
      # tag suffix (computed once in the publish job) and for the
      # RSTUDIO_VERSION build-arg.
      - name: Resolve the RStudio version
        id: meta
        run: |
          set -euo pipefail
          RSVER=$(bash ./scripts/resolve-rstudio-version.sh --tag)
          echo "rsver=$RSVER" >> "$GITHUB_OUTPUT"

      # Build this leg's single native platform once and push the result by
      # digest — no tag, no manifest list. Scheduled/manual runs rebuild from
      # scratch (no-cache) to pull in new RStudio/Pandoc/Quarto and a newer r2u
      # base; push-triggered (code change) runs reuse the cache for speed. The
      # cache scope is per (variant, arch), so the two architectures never
      # shadow each other's layers.
      - name: Build ${{ matrix.variant }} (${{ matrix.arch }}) and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            RSTUDIO_VERSION=${{ steps.meta.outputs.rsver }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      # Pull the pushed digest back and prove it is the architecture this leg
      # claims — both as the image records it and as the running kernel reports
      # it. Without these two assertions a mis-wired matrix could smoke-test the
      # same amd64 image twice and still look green.
      - name: Pull back the pushed image and assert its architecture
        id: pulled
        run: |
          set -euo pipefail
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          got_arch=$(docker image inspect --format '{{.Architecture}}' "$ref")
          if [ "$got_arch" != "${{ matrix.arch }}" ]; then
            echo "::error::image architecture is '$got_arch', expected '${{ matrix.arch }}'"
            exit 1
          fi
          case "${{ matrix.arch }}" in
            amd64) want_uname=x86_64 ;;
            arm64) want_uname=aarch64 ;;
            *) echo "::error::unknown arch '${{ matrix.arch }}'"; exit 1 ;;
          esac
          got_uname=$(docker run --rm --entrypoint uname "$ref" -m)
          if [ "$got_uname" != "$want_uname" ]; then
            echo "::error::container reports 'uname -m' = '$got_uname', expected '$want_uname'"
            exit 1
          fi
          echo "image is ${{ matrix.arch }} ($got_arch / $got_uname): $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # A non-zero exit here fails this leg and, because the publish job
      # requires both of a variant's digests, blocks that variant's tags from
      # moving. The deepened smoke exercises the bundled/symlinked Quarto and
      # r2u binary paths where arm64 can diverge from amd64 (GP3, Known issue
      # #3); running on native hardware, arm64 needs no longer timeout than
      # amd64.
      - name: Smoke-test ${{ matrix.variant }} (${{ matrix.arch }})
        env:
          SMOKE_TIMEOUT: "300"
        run: bash ./.github/smoke-test.sh "${{ steps.pulled.outputs.ref }}"

      # Hand the verified digest to the publish job. The upload happens only
      # after the smoke test passes, so an unverified leg contributes no digest
      # and its variant cannot be published.
      - name: Export the verified digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One publish leg per variant: assemble the multi-arch manifest list from that
  # variant's two verified digests and attach every tag to it in a single
  # imagetools call. always() with a per-variant digest check is what keeps the
  # variants independent — GitHub cannot express "needs only my variant's build
  # legs", so each publish leg instead requires exactly two digests of its own
  # and fails loudly when a leg of its variant did not produce one.
  publish:
    name: publish (${{ matrix.variant }})
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            mutable: latest noble
          - variant: resolute
            mutable: resolute
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jmgirard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download this variant's digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      # Mutable tags (latest/noble/resolute) plus immutable tags that pin the
      # date and the RStudio version, so a course can pin a reproducible image
      # (GP2). Resolved once here, for the whole manifest list.
      - name: Compute the tag list
        id: tags
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          RSVER=$(bash ./scripts/resolve-rstudio-version.sh --tag)
          {
            echo "tags<<EOF"
            for t in ${{ matrix.mutable }}; do echo "$IMAGE:$t"; done
            echo "$IMAGE:${{ matrix.variant }}-$DATE"
            echo "$IMAGE:${{ matrix.variant }}-$RSVER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # In test mode --dry-run prints the manifest list it would push and
      # attaches nothing; otherwise the tags are created and read back.
      - name: Create the manifest list
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          TAGS: ${{ steps.tags.outputs.tags }}
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          n=$(find . -type f | wc -l | tr -d ' ')
          if [ "$n" -ne 2 ]; then
            echo "::error::expected 2 verified digests for ${{ matrix.variant }}, found $n — a build leg failed or was skipped"
            exit 1
          fi
          refs=()
          for f in *; do refs+=("${IMAGE}@sha256:$f"); done
          echo "tags for ${{ matrix.variant }}:"
          printf '  %s\n' $TAGS
          tag_args=()
          for t in $TAGS; do tag_args+=(-t "$t"); done
          if [ "$TEST_MODE" = "true" ]; then
            echo "test mode: printing the manifest list instead of publishing"
            docker buildx imagetools create --dry-run "${tag_args[@]}" "${refs[@]}"
          else
            docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
            docker buildx imagetools inspect "$(printf '%s' "$TAGS" | head -1)"
          fi

  # Scheduled runs only: nobody is watching a weekly rebuild, so a failure
  # opens (or updates) a ci-failure issue and the next green run closes it
  # (GP7). Push and dispatch runs have a person behind them and skip this job.
  # always() is required: without it a failed build job would skip the very
  # job that reports the failure.
  notify:
    needs: [build, publish]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The failed variant names are extracted from this run's own job list by
      # ci-failure-issue.sh (the one copy of that logic, unit-tested in
      # scripts/tests/test_ci_failure_issue.sh); the two jobs' aggregate results
      # decide whether the issue is opened or closed.
      - name: Open, update, or close the ci-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" = failure ] || [ "$PUBLISH_RESULT" = failure ]; then
            result=failure
          elif [ "$BUILD_RESULT" = success ] && [ "$PUBLISH_RESULT" = success ]; then
            result=success
          else
            result="$BUILD_RESULT"
          fi
          # A failed job listing must not block the alert itself: warn and let
          # the script fall back to its generic "see the run summary" text.
          gh run view "$GITHUB_RUN_ID" --json jobs > jobs.json || {
            echo "::warning::gh run view failed; the issue will not name the failed variants"
            echo '{"jobs":[]}' > jobs.json
          }
          bash ./.github/ci-failure-issue.sh "$result" "$RUN_URL" jobs.json
