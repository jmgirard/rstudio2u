name: Check the weekly rebuild is not stale

# The one alert no run can raise for itself. docker.yml's `notify` job reports
# on a run that happened; a run that never happens reports nothing, and the
# always-fresh commitment (GP2) would end in silence. This workflow measures
# the thing directly — how long since a scheduled rebuild last succeeded — so a
# disabled schedule, a deleted workflow, a GitHub outage and a month of red
# builds all surface as the same alert, because they are the same symptom.
#
# Its own bound: this workflow is itself on a schedule, so once GitHub has
# disabled the repository's scheduled workflows it is disabled with them and
# reports nothing. That failure mode belongs to docker.yml's `keepalive` job,
# which exists to stop it happening; this check does not cover it and is not
# meant to.
#
# No rule is in this file: .github/last-rebuild-success.sh finds the date of
# the last success and .github/rebuild-gap.sh decides whether it is too old,
# unit-tested in scripts/tests/test_last_rebuild_success.sh and
# scripts/tests/test_rebuild_gap.sh. The step below hands the first one's
# answer, today's date and a threshold to the second, and does nothing else
# (the keepalive.sh pattern).

on:
  # Mondays at 12:00 UTC, six hours after docker.yml's 06:00 rebuild, so the
  # run this check measures has finished before it is measured. Weekly, to
  # match the cadence of the thing it watches: a gap that stays open gets one
  # follow-up comment a week rather than a daily stream on the same issue.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "The largest gap, in days, that is not yet an alert. More than this many days since a scheduled rebuild last succeeded raises the ci-failure issue. Both workflows are weekly, so a real gap is always a multiple of seven days; the default of 8 is what makes the second missed rebuild the alert, and anything from 8 to 13 picks the same week. The scheduled run has no inputs and takes the same default from the job's own fallback below -- change the policy and both sites move together."
        type: string
        default: "8"

jobs:
  gap:
    # One word, no spaces. Nothing here puts this name in an issue title -- the
    # gap alert passes a subject and no jobs document at all -- but the repo's
    # other alert path joins failed-job names on a space, so a job name without
    # one stays safe if this job is ever wired into that path.
    name: rebuild-gap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Alert if no scheduled rebuild has succeeded lately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Absent on a scheduled run, where the `inputs` context is null, so
          # this fallback is the scheduled policy. The dispatch input's own
          # default (above) and the DESIGN Conventions bullet state the same
          # 8; all three move together or not at all.
          THRESHOLD: ${{ inputs.threshold_days || '8' }}
        run: |
          set -euo pipefail
          # The date of the newest successful scheduled docker.yml run, or
          # `none` / `unknown`: .github/last-rebuild-success.sh holds the
          # lookup and every branch of reading its answer, unit-tested in
          # scripts/tests/test_last_rebuild_success.sh. It exits 0 on all of
          # them, so the gap script below is always reached.
          bash ./.github/last-rebuild-success.sh last_success.txt
          last_success="$(cat last_success.txt)"
          today=$(date -u +%Y-%m-%d)
          echo "last successful scheduled rebuild: $last_success; today is $today (UTC)"
          bash ./.github/rebuild-gap.sh "$last_success" "$today" "$THRESHOLD"
