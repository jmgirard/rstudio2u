name: Check the weekly rebuild is not stale

# The one alert no run can raise for itself. docker.yml's `notify` job reports
# on a run that happened; a run that never happens reports nothing, and the
# always-fresh commitment (GP2) would end in silence. This workflow measures
# the thing directly — how long since a scheduled rebuild last succeeded — so a
# disabled schedule, a deleted workflow, a GitHub outage and a month of red
# builds all surface as the same alert, because they are the same symptom.
#
# Its own bound: this workflow is itself on a schedule, so once GitHub has
# disabled the repository's scheduled workflows it is disabled with them and
# reports nothing. That failure mode belongs to docker.yml's `keepalive` job,
# which exists to stop it happening; this check does not cover it and is not
# meant to.
#
# The staleness rule is not in this file: .github/rebuild-gap.sh holds it,
# unit-tested in scripts/tests/test_rebuild_gap.sh, and the step below hands it
# two dates and a threshold and nothing else (the keepalive.sh pattern).

on:
  # Mondays at 12:00 UTC, six hours after docker.yml's 06:00 rebuild, so the
  # run this check measures has finished before it is measured. Weekly, to
  # match the cadence of the thing it watches: a gap that stays open gets one
  # follow-up comment a week rather than a daily stream on the same issue.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "The largest gap, in days, that is not yet an alert. More than this many days since a scheduled rebuild last succeeded raises the ci-failure issue. The scheduled run has no inputs and takes the same default from the job's own fallback below -- change the policy and both sites move together."
        type: string
        default: "15"

jobs:
  gap:
    # One word, no spaces: the failed-job names in a ci-failure title are joined
    # on a space, so a job name containing one would render ambiguously there.
    name: rebuild-gap
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alert if no scheduled rebuild has succeeded lately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Absent on a scheduled run, where the `inputs` context is null, so
          # this fallback is the scheduled policy. The dispatch input's own
          # default (above) and the DESIGN Conventions bullet state the same
          # 15; all three move together or not at all.
          THRESHOLD: ${{ inputs.threshold_days || '15' }}
        run: |
          set -euo pipefail
          # The newest SUCCESSFUL SCHEDULED docker.yml run, and only that: a
          # push-triggered or dispatched build proves someone was here, not
          # that the unattended lane still works, and the unattended lane is
          # what this checks.
          if ! gh run list --workflow docker.yml --event schedule \
                 --status success --limit 1 --json createdAt \
                 --jq '.[0].createdAt // empty' > created_at.txt; then
            # The lookup itself failed. Not a measured gap and not a clean
            # bill of health, so it is neither reported as one: `unknown` is
            # the sentinel the script renders as its own alert.
            echo "::warning::gh run list failed; reporting an unreadable rebuild history"
            last_success=unknown
          else
            created_at="$(cat created_at.txt)"
            if [ -z "$created_at" ]; then
              # The query worked and matched nothing: no successful scheduled
              # run is on record. That is a gap, and saying so explicitly is
              # what keeps an empty string from reaching the script as a
              # mis-shaped date and being refused instead of reported.
              last_success=none
            else
              # `createdAt` is RFC 3339 in UTC (a trailing Z), so the date is
              # the ten characters before the T -- no `date` parsing, whose
              # flags differ between GNU and BSD.
              last_success="${created_at%%T*}"
            fi
          fi
          today=$(date -u +%Y-%m-%d)
          echo "last successful scheduled rebuild: $last_success; today is $today (UTC)"
          bash ./.github/rebuild-gap.sh "$last_success" "$today" "$THRESHOLD"
